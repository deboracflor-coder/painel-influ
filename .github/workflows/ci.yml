name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tipos das Edge Functions (Deno)
        run: npm run typecheck:functions
      - run: npm test
      - name: Build (só variáveis públicas)
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: chave-publica-de-exemplo-para-build
        run: npm run build
      - name: Orçamento de tamanho do app
        run: npm run check:bundle
      - name: Dependências do app publicado sem vulnerabilidade alta ou crítica
        run: npm audit --omit=dev --audit-level=high
      - name: Nenhuma credencial versionada
        run: |
          if git ls-files -z -- . ':!.github/workflows/ci.yml' | xargs -0 grep -nIE 'eyJhbGciOi[A-Za-z0-9_-]{20,}\.|GOCSPX-|EAA[A-Za-z0-9]{40,}|ya29\.[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY'; then
            echo "Possível credencial no repositório"; exit 1
          fi

  database:
    name: Banco (RLS, privilégios e isolamento)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Subir Supabase local
        run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor,postgres-meta
      - name: Testes pgTAP (privilégios + isolamento)
        run: npx supabase test db
      - name: Tipos do banco estão em dia
        run: |
          npx supabase gen types typescript --local > /tmp/database.ts
          diff -u src/types/database.ts /tmp/database.ts
      - name: Servir Edge Functions
        run: |
          nohup npx supabase functions serve --env-file supabase/functions/.env.test > /tmp/functions.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/admin-users -d '{}' || true)
            [ "$code" = "401" ] && exit 0; sleep 2
          done
          cat /tmp/functions.log; exit 1
      - name: Testes de isolamento pela API REST e convites
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run test:api
      - name: Bundle não contém a service role
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="$ANON_KEY" npm run build
          if grep -rqF "$SERVICE_ROLE_KEY" dist; then echo "service role encontrada no bundle"; exit 1; fi
      - name: Log das Edge Functions
        if: failure()
        run: cat /tmp/functions.log || true

  e2e:
    name: Navegador (ponta a ponta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navegador para os testes
        run: npx playwright install --with-deps chromium
      - name: Subir Supabase local
        run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor,postgres-meta,edge-runtime
      - name: Testes de ponta a ponta (dados fictícios do seed)
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run test:e2e
      - name: Relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
